name: Deploy GitHub Pages

# Static build of Labor Pulse for https://dust2ash7.github.io/Labor-Pulse/.
# The app keeps all data in localStorage, so the prerendered client build is
# the whole app; server/ (Grok PWA middleware) and migrations/ (auth tables)
# are only used by the hosted Grok/Vercel build, not by Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Build static site under /Labor-Pulse/
        run: npx vite build
        env:
          PAGES_BASE: /Labor-Pulse/

      - name: SPA fallback
        run: cp dist/client/index.html dist/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
